<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat VPN App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: var(--tg-theme-bg-color); color: var(--tg-theme-text-color); margin: 0; padding: 20px; transition: all 0.3s; }
        .page { display: none; } /* Скрываем все страницы по умолчанию */
        .page.active { display: block; } /* Показываем только активную */
        
        .btn { display: block; width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; background: var(--tg-theme-button-color); color: var(--tg-theme-button-text-color); font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .card { background: var(--tg-theme-secondary-bg-color); padding: 15px; border-radius: 12px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="homePage" class="page active">
        <h1>Cat VPN</h1>
        <div class="card">
            <p>Добро пожаловать! Выберите действие:</p>
        </div>
        <button class="btn" onclick="showPage('setupPage')">🚀 Настроить подключение</button>
        <button class="btn" onclick="showPage('routingPage')">⚙️ Настройки роутинга</button>
    </div>

    <div id="setupPage" class="page">
        <h1>Подключение</h1>
        <div class="card">Выберите ваше приложение для импорта подписки:</div>
        <a href="happ://add/ВАША_ССЫЛКА" class="btn">Импорт в Happ</a>
        <a href="v2raytun://import/ВАША_ССЫЛКА" class="btn">Импорт в v2raytun</a>
    </div>

    <div id="routingPage" class="page">
        <h1>Роутинг (Happ)</h1>
        <button class="btn" onclick="location.href='happ://routing/onadd/ВАШ_BASE64'">Включить правила</button>
        <button class="btn" onclick="location.href='happ://routing/off'">Выключить правила</button>
    </div>

<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // Функция переключения страниц
    function showPage(pageId) {
        // Скрываем все страницы
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        // Показываем нужную
        document.getElementById(pageId).classList.add('active');

        // Если мы не на главной, показываем кнопку "Назад" в Telegram
        if (pageId !== 'homePage') {
            tg.BackButton.show();
        } else {
            tg.BackButton.hide();
        }
    }

    // Слушаем нажатие кнопки "Назад" в самом Telegram
    tg.BackButton.onClick(() => {
        showPage('homePage');
    });
</script>
</body>
</html>
