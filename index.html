<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cat-Connect 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --btn: var(--tg-theme-button-color, #2481cc);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f0f0f0);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 16px;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden; transition: background 0.3s ease;
        }

        /* Анимация переключения страниц */
        .page {
            display: none; width: 100%; max-width: 400px;
            animation: fadeIn 0.25s ease-out;
        }
        .page.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        header { text-align: center; margin-bottom: 24px; }
        h2 { font-size: 20px; margin-bottom: 20px; text-align: center; }

        /* Сетка кнопок 2x2 */
        .grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 12px; width: 100%; margin-bottom: 20px;
        }

        .card {
            background: var(--sec-bg); border-radius: 16px;
            padding: 20px 12px; text-align: center; border: none;
            color: var(--text); cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 600;
        }
        .card:active { transform: scale(0.94); background: var(--btn); color: var(--btn-text); }
        .card i { font-size: 30px; margin-bottom: 10px; }

        /* Список кнопок внизу */
        .list { width: 100%; display: flex; flex-direction: column; gap: 8px; }
        .list-item {
            background: var(--sec-bg); padding: 14px 16px;
            border-radius: 14px; display: flex; align-items: center; gap: 12px;
            cursor: pointer; text-decoration: none; color: var(--text);
            font-weight: 500; transition: transform 0.1s;
        }
        .list-item:active { transform: scale(0.98); background: var(--btn); color: var(--btn-text); }

        /* Виджет теста соединения */
        .test-widget {
            margin-top: 30px; width: 100%; background: var(--sec-bg);
            border-radius: 18px; padding: 16px; box-sizing: border-box;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .profile-img { 
            width: 90px; height: 90px; border-radius: 50%; 
            border: 3px solid var(--btn); margin-bottom: 15px; 
            background: #eee; object-fit: cover;
        }
    </style>
</head>
<body>

    <div id="home" class="page active">
        <header>
            <div style="font-size: 50px;">🐱</div>
            <h1 style="margin: 0; font-size: 26px; font-weight: 800;">Cat-Connect 2.0</h1>
        </header>

        <div class="grid">
            <button class="card" onclick="nav('download')"><i>📥</i><span>Скачать</span></button>
            <button class="card" onclick="nav('servers')"><i>🌐</i><span>Серверы</span></button>
            <button class="card" onclick="nav('profile')"><i>👤</i><span>Профиль</span></button>
            <button class="card" onclick="nav('info')"><i>ℹ️</i><span>Инфо</span></button>
        </div>

        <div class="list">
            <div class="list-item" onclick="nav('instr')"><span>📖</span> Инструкция</div>
            <div class="list-item" onclick="contactAuthor()"><span>✉️</span> Написать автору</div>
            <div class="list-item" onclick="nav('donate')"><span>☕</span> Поддержать копейкой</div>
        </div>

        <div class="test-widget">
            <div id="test-info">
                <span style="font-size: 12px; color: var(--hint); font-weight: 700; text-transform: uppercase;">Тест соединения</span><br>
                <span id="ping-status" style="font-size: 15px; font-weight: 600;">Загрузка...</span>
            </div>
            <div onclick="runPing()" style="cursor:pointer; font-size: 24px; padding: 5px;">🔄</div>
        </div>
    </div>

        </div>
    </div>
